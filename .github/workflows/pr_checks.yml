name: PR checks

on:
    pull_request:
    push:
        branches:
            - main
            - develop

jobs:
    checks:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle

            - run: chmod +x gradlew

            - run: ./gradlew detekt

            - run: ./gradlew assembleDebug
